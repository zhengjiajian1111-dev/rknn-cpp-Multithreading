; =====================================================================
;  rknn_multi_stream 配置文件
;  运行: ./rknn_multi_stream -c config/app.ini
;  以 ; 或 # 开头为注释. [sourceN] [modelN] [pushN] 按编号排序, 可任意增减.
; =====================================================================

[general]
log_level = info        ; debug | info | warn | error
perf_interval = 5       ; 性能报告打印周期(秒), 0 = 不打印
display = 1             ; 本地窗口显示拼接画面; 无 DISPLAY(SSH/服务)时自动关闭
use_rga = 1             ; RGA 加速 NV12->BGR / 缩放 / BGR->NV12, 失败自动回退 OpenCV

; ---------------------------------------------------------------------
; 输入源: MP4 文件 / rtsp:// / rtmp:// / http(s)://*.flv / /dev/videoN
; ---------------------------------------------------------------------
[source0]
name = cam0
url = ../../720p60hz.mp4
loop = 1                ; 文件播完循环
realtime = 1            ; 文件按 pts 节奏读取(模拟实时流)

[source1]
name = cam1
url = ../../720p60hz.mp4

[source2]
name = cam2
url = ../../720p60hz.mp4

[source3]
name = cam3
url = ../../720p60hz.mp4
; url = rtsp://admin:password@192.168.1.64:554/Streaming/Channels/101
; rtsp_transport = tcp  ; tcp | udp
; timeout_ms = 5000     ; 打开/读包超时, 超时即重连
; reconnect_max_ms = 30000

[decoder]
backend = auto          ; auto(MPP 硬解, 失败回退 FFmpeg 软解) | mpp | ffmpeg
mpp_split_parse = 1     ; 1: MPP 内部分帧(最稳妥); 0: 输入已是整帧, 少一帧延迟
packet_queue = 64       ; 拉流->解码 包队列; 实时流溢出时按 GOP 丢包

; ---------------------------------------------------------------------
; 模型: 可配置多个 [modelN], 同一帧并发推理后融合
; ---------------------------------------------------------------------
[model0]
name = yolov5s
path = ./model/RK3588/yolov5s-640-640.rknn
labels = ./model/coco_80_labels_list.txt
instances = 3           ; 上下文实例数(dup_context 共享权重) = 该模型最大并发
core = auto             ; auto(实例轮询绑定 core0/1/2) | any(驱动调度) | 0 | 1 | 2 | 0_1 | 0_1_2
conf_thresh = 0.25
nms_thresh = 0.45
letterbox = 1           ; 等比缩放+灰边填充(与训练一致); 0 = 拉伸
weight = 1.0            ; 融合权重

; 第二个模型示例(如专门训练的检测模型), 打开后与 model0 做融合
; [model1]
; name = yolov5s_custom
; path = ./model/RK3588/custom.rknn
; labels = ./model/custom_labels.txt
; instances = 2
; weight = 0.8

[infer]
infer_interval = 1      ; 跳帧推理: 每 N 帧推理 1 次, 其余帧复用最近结果
target_fps = 25         ; 每路目标处理帧率(超出丢帧), 0 = 不限
reuse_max_ms = 500      ; 复用结果的最大时效
draw_model_boxes = 0    ; 调试: 额外画出各模型的原始框
threads = 0             ; 多模型推理线程池大小, 0 = 实例总数
; use_rga = 0           ; 前处理(缩放 + BGR->RGB)单独选择: 1 = RGA, 0 = OpenCV; 不写则跟随 [general] use_rga
                        ; 普通内存上 RGA 每次都要映射内存、刷缓存, 不一定比 OpenCV 快, 以 <model>.pre 实测为准

[fusion]
method = weighted       ; nms | weighted(WBF) | confidence(noisy-OR)
iou_thresh = 0.55       ; 跨模型关联 IoU 阈值
nms_thresh = 0.45       ; 融合后 NMS 阈值
score_thresh = 0.25     ; 参与融合的最低分
min_votes = 1           ; 至少 N 个模型检出才保留: 1=高召回, 模型数=高精度
class_agnostic = 0      ; 1: 不同类别的框也互相关联/抑制

[mosaic]
width = 1920
height = 1080
fps = 25
cols = 0                ; 0 = 自动(4 路 -> 2x2)
show_label = 1

; ---------------------------------------------------------------------
; 推流: 每个 [pushN] 一个独立线程, enable 开关控制, 可同时开多路
;   source = mosaic 推拼接画面; source = 0/1/2/3 推单路结果
;   encoder = auto(MPP 硬编, 失败回退 FFmpeg) | mpp | ffmpeg | ffmpeg:libx264
; ---------------------------------------------------------------------
[push0]
enable = 0
type = rtmp
url = rtmp://127.0.0.1:1935/live/mosaic
source = mosaic
fps = 25
bitrate_kbps = 4000
gop = 50
encoder = auto
overlay = 1             ; 叠加时间戳/统计信息

[push1]
enable = 0
type = rtsp
url = rtsp://127.0.0.1:8554/ch0
source = 0
rtsp_transport = tcp
fps = 25
bitrate_kbps = 2000

[push2]
enable = 0
type = gb28181
source = mosaic
fps = 25
bitrate_kbps = 2000
gop = 25
sip_server_ip = 192.168.1.100
sip_server_port = 5060
sip_server_id = 34020000002000000001
sip_domain = 3402000000
device_id = 34020000001320000001
channel_id = 34020000001310000001
device_name = rknn-multi-stream
password = 12345678
; local_ip =            ; 为空自动探测到平台的出口地址
local_sip_port = 5060   ; 被占用时自动顺延
media_port = 0          ; 0 = 系统分配
expires = 3600
keepalive = 60
keepalive_max_miss = 3
on_duplicate_invite = replace   ; replace: BYE 旧会话接受新点播 | reject: 回 486 Busy
